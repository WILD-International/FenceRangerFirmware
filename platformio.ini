; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
framework = arduino
extra_scripts = pre:scripts/embed_html.py
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  jgromes/RadioLib@7.5.0

[env:heltec_wifi_lora_32_V4]
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V4
framework = arduino
board_build.variants_dir = variants
board_build.variant = heltec_V4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:scripts/embed_html.py
build_flags =
  !echo "-DGIT_TAG=\\\"$(git describe --tags --always --dirty)\\\""
  ; Strip machine-specific absolute paths from __FILE__ strings so local and CI
  ; builds produce byte-identical binaries
  -ffile-prefix-map=${platformio.core_dir}=pio
  !echo "-ffile-prefix-map=$PWD=project"
  ; -D RADIOLIB_DEBUG_BASIC=1
  ; -D RADIOLIB_DEBUG_PROTOCOL=1
build_src_flags = -Wall
lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  jgromes/RadioLib@7.5.0

[env:heltec_wifi_lora_32_V4_GC1109]
extends = env:heltec_wifi_lora_32_V4
build_flags =
  ${env:heltec_wifi_lora_32_V4.build_flags}
  -DUSE_GC1109_PA

; Host-side unit tests (pio test -e native). Compiles only the pure modules under
; test, with logging disabled so no Arduino/Serial dependency is pulled in.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<alert.cpp>
build_flags =
  -DDISABLE_LOGGING
  -Isrc
